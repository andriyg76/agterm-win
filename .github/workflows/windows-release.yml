name: windows-release

# Run by hand on windows-port: picks the next v<AGTERM_VERSION>.<n> from the existing tags, builds the x64 and arm64
# installers and MSIX packages on GitHub-hosted runners (as SignPath Foundation requires of every job before a signing request), has SignPath sign it
# once SIGNPATH_ORGANIZATION_ID is set, and publishes the release, which creates the tag on the built commit.
# Without SignPath configured the release ships unsigned.
on:
  workflow_dispatch:

concurrency:
  group: windows-release

permissions:
  contents: write
  actions: read

env:
  SWIFT_VERSION: swift-6.4.3-release
  SWIFT_BUILD: 6.4.3-RELEASE

jobs:
  version:
    if: github.ref == 'refs/heads/windows-port'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
      - id: next
        shell: pwsh
        run: |
          $agterm = Get-Content agterm-windows/AGTERM_VERSION -TotalCount 1
          $prefix = "v$agterm."
          $last = git tag --list "$prefix*" | % { $_.Substring($prefix.Length) } | ? { $_ -match '^\d+$' } | % { [int]$_ } |
            Measure-Object -Maximum
          $version = "$agterm.$(1 + [int]$last.Maximum)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "releasing $version"

  # each architecture builds natively, since Swift on Windows does not cross-compile the app here
  build:
    needs: version
    strategy:
      matrix:
        include:
          - { arch: x64, runner: windows-2022, swift-arch: amd64 }
          - { arch: arm64, runner: windows-11-arm, swift-arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
        working-directory: agterm-windows
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          swift-build: ${{ env.SWIFT_BUILD }}
          build_arch: ${{ matrix.swift-arch }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        env:
          AGTERM_ALLOW_UNSIGNED: "1"
        run: ./scripts/release.ps1 -Version $env:VERSION -Arch ${{ matrix.arch }}
      # the Store signs it, so it is an artifact for Partner Center rather than a release asset
      - name: MSIX
        env:
          AGTERM_MSIX_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          AGTERM_MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          AGTERM_MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ./scripts/msix.ps1 -Version $env:VERSION -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: msix-${{ matrix.arch }}
          path: agterm-windows/build/release/agterm-win-*-${{ matrix.arch }}.msix
          if-no-files-found: error
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned-${{ matrix.arch }}
          path: agterm-windows/build/release/agterm-win-*-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
      # the artifact configuration signs the one installer inside the uploaded zip:
      #   <zip-file><pe-file path="agterm-win-*-setup.exe"><authenticode-sign/></pe-file></zip-file>
      - if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: agterm-win
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: agterm-windows/build/signed
      - name: Release installer
        run: |
          $signed = Test-Path build/signed
          $setup = Get-Item "$(if ($signed) { 'build/signed' } else { 'build/release' })/agterm-win-$env:VERSION-${{ matrix.arch }}-setup.exe"
          New-Item -ItemType Directory build/publish | Out-Null
          Copy-Item $setup.FullName build/publish
          if ($signed) { New-Item build/publish/signed | Out-Null }
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.arch }}
          path: agterm-windows/build/publish
          if-no-files-found: error

  chocolatey:
    needs: [version, build]
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: installer-[ax]*
          path: installers
      - name: Pack Chocolatey package
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'agterm-windows/packaging/chocolatey'
          $out = "agterm-windows/build/package-managers/$env:VERSION/chocolatey"
          New-Item -ItemType Directory -Force "$out/tools" | Out-Null
          $installers = @{}
          foreach ($arch in 'x64', 'arm64') {
            $setup = Get-ChildItem installers -Recurse -Filter "agterm-win-$env:VERSION-$arch-setup.exe"
            if (@($setup).Count -ne 1) { throw "expected one $arch installer, found $(@($setup).Count)" }
            $installers[$arch] = @{
              Url = "https://github.com/$env:REPOSITORY/releases/download/v$env:VERSION/$($setup.Name)"
              Sha256 = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant()
            }
          }
          $tokens = @{
            Version = $env:VERSION
            UrlX64 = $installers.x64.Url
            Sha256X64 = $installers.x64.Sha256
            UrlArm64 = $installers.arm64.Url
            Sha256Arm64 = $installers.arm64.Sha256
          }
          foreach ($file in Get-ChildItem $source -Recurse -File) {
            $text = [IO.File]::ReadAllText($file.FullName)
            foreach ($name in $tokens.Keys) { $text = $text.Replace("{{$name}}", $tokens[$name]) }
            if ($text -match '\{\{\w+\}\}') { throw "$($file.Name) has an unknown token $($Matches[0])" }
            $target = Join-Path $out $file.FullName.Substring($source.Length + 1)
            New-Item -ItemType Directory -Force (Split-Path -Parent $target) | Out-Null
            [IO.File]::WriteAllText($target, $text, [Text.UTF8Encoding]::new($false))
          }
          choco pack "$out/agterm-win.nuspec" --out "agterm-windows/build/package-managers/$env:VERSION"
          if ($LASTEXITCODE) { throw 'choco pack failed' }
          choco push "agterm-windows/build/package-managers/$env:VERSION/agterm-win.$env:VERSION.nupkg" `
            --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE) { throw 'Chocolatey Community Repository upload failed' }
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: chocolatey-package
          path: agterm-windows/build/package-managers/${{ needs.version.outputs.version }}/agterm-win.${{ needs.version.outputs.version }}.nupkg
          if-no-files-found: error

  publish:
    needs: [version, build, chocolatey]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: installer-[ax]*
          path: publish
      - uses: actions/download-artifact@v7
        with:
          name: chocolatey-package
          path: publish/chocolatey
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $agterm = Get-Content agterm-windows/AGTERM_VERSION -TotalCount 1
          $signed = @(Get-ChildItem publish -Recurse -Filter signed).Count -eq 2
          $assets = foreach ($setup in Get-ChildItem publish -Recurse -Filter "agterm-win-$env:VERSION-*-setup.exe") {
            $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText("$($setup.FullName).sha256", "$hash  $($setup.Name)`n")
            $setup.FullName
            "$($setup.FullName).sha256"
          }
          if ($assets.Count -ne 4) { throw "expected the x64 and arm64 installers, got $($assets -join ', ')" }
          $package = Get-Item "publish/chocolatey/agterm-win.$env:VERSION.nupkg"
          $assets += $package.FullName
          $notes = "agterm-win $env:VERSION, locked to agterm ${agterm}: Windows 10 1809 or later, x64 or arm64, installs per user without admin."
          $notes += if ($signed) { "`n`nFree code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org)." } else { "`n`nUnsigned: SmartScreen warns on first run." }
          gh release create "v$env:VERSION" --target $env:GITHUB_SHA @assets --title "agterm-win $env:VERSION" --notes $notes
      - name: Submit WinGet update
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) { throw 'Set the WINGET_CREATE_GITHUB_TOKEN repository secret before releasing.' }
          $wingetCreate = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest 'https://aka.ms/wingetcreate/latest' -OutFile $wingetCreate
          & $wingetCreate update andriyg76.agterm-win `
            --version $env:VERSION `
            --urls "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/agterm-win-$env:VERSION-x64-setup.exe,https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/agterm-win-$env:VERSION-arm64-setup.exe" `
            --submit --no-open
          if ($LASTEXITCODE) { throw 'WinGet manifest submission failed' }
