name: windows-release

# Run by hand on windows-port: picks the next v<AGTERM_VERSION>.<n> from the existing tags, builds the installer on a
# GitHub-hosted runner (as SignPath Foundation requires of every job before a signing request), has SignPath sign it
# once SIGNPATH_ORGANIZATION_ID is set, and publishes the release, which creates the tag on the built commit.
# Without SignPath configured the release ships unsigned.
on:
  workflow_dispatch:

concurrency:
  group: windows-release

permissions:
  contents: write
  actions: read

env:
  SWIFT_VERSION: swift-6.4.3-release
  SWIFT_BUILD: 6.4.3-RELEASE

jobs:
  release:
    if: github.ref == 'refs/heads/windows-port'
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
        working-directory: agterm-windows
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
      - id: version
        name: Next version
        run: |
          $agterm = Get-Content AGTERM_VERSION -TotalCount 1
          $prefix = "v$agterm."
          $last = git tag --list "$prefix*" | % { $_.Substring($prefix.Length) } | ? { $_ -match '^\d+$' } | % { [int]$_ } |
            Measure-Object -Maximum
          $version = "$agterm.$(1 + [int]$last.Maximum)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "releasing $version"
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          swift-build: ${{ env.SWIFT_BUILD }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        env:
          AGTERM_ALLOW_UNSIGNED: "1"
        run: ./scripts/release.ps1 -Version ${{ steps.version.outputs.version }}
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: agterm-windows/build/release/agterm-win-*-x64-setup.exe
          if-no-files-found: error
      # the artifact configuration signs the one installer inside the uploaded zip:
      #   <zip-file><pe-file path="agterm-win-*-x64-setup.exe"><authenticode-sign/></pe-file></zip-file>
      - if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: agterm-win
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: agterm-windows/build/signed
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $agterm = Get-Content AGTERM_VERSION -TotalCount 1
          $signed = Test-Path build/signed
          $setup = Get-Item "$(if ($signed) { 'build/signed' } else { 'build/release' })/agterm-win-$version-x64-setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$($setup.FullName).sha256", "$hash  $($setup.Name)`n")
          $notes = "agterm-win $version, locked to agterm ${agterm}: Windows 10 1809 or later, x64, installs per user without admin."
          $notes += if ($signed) { "`n`nFree code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org)." } else { "`n`nUnsigned: SmartScreen warns on first run." }
          gh release create "v$version" --target $env:GITHUB_SHA $setup.FullName "$($setup.FullName).sha256" --title "agterm-win $version" --notes $notes
