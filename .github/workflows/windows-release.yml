name: windows-release

# Run by hand with a release kind (scripts/release-version.ps1 owns the rules): major, minor or incremental bumps that part
# of the last release reachable from the branch; version/v<major>.<minor> takes only incremental. Builds the x64 and arm64
# installers and MSIX packages on GitHub-hosted runners (as SignPath Foundation requires of every job before a signing request), has SignPath sign it
# once SIGNPATH_ORGANIZATION_ID is set, and publishes the release, which creates the tag on the built commit.
# Without SignPath configured the release ships unsigned.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "which part to bump; version/v* branches take only incremental"
        required: true
        type: choice
        options: [incremental, minor, major]

concurrency:
  group: windows-release

permissions:
  contents: write
  actions: read

env:
  SWIFT_VERSION: swift-6.4.3-release
  SWIFT_BUILD: 6.4.3-RELEASE

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      base: ${{ steps.next.outputs.base }}
      base-line: ${{ steps.next.outputs.base-line }}
      latest: ${{ steps.next.outputs.latest }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
      - id: next
        shell: pwsh
        env:
          KIND: ${{ inputs.kind }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_REF -notlike 'refs/heads/*') { throw "run on a branch, not $env:GITHUB_REF" }
          $next = ./agterm-windows/scripts/release-version.ps1 -Kind $env:KIND -Branch $env:BRANCH
          "version=$($next.Version)" >> $env:GITHUB_OUTPUT
          "base=$($next.Base)" >> $env:GITHUB_OUTPUT
          "base-line=$($next.BaseLine)" >> $env:GITHUB_OUTPUT
          "latest=$($next.Latest.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          # a new line's release commit carries its major.minor.0, so unreleased builds after it show the new line
          if ($next.NewLine) {
            $line = ($next.Version -split '\.')[0..1] -join '.'
            Set-Content agterm-windows/VERSION "$line.0"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -am "agterm-windows: version $line.0 for the $($next.Version) release"
            git push origin "HEAD:$env:BRANCH"
            if ($LASTEXITCODE) { throw "pushing the VERSION bump to $env:BRANCH failed" }
          }
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "releasing $($next.Version) ($env:KIND after $($next.Base))"

  # each architecture builds natively, since Swift on Windows does not cross-compile the app here
  build:
    needs: version
    strategy:
      matrix:
        include:
          - { arch: x64, runner: windows-2022, swift-arch: amd64 }
          - { arch: arm64, runner: windows-11-arm, swift-arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
        working-directory: agterm-windows
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          swift-build: ${{ env.SWIFT_BUILD }}
          build_arch: ${{ matrix.swift-arch }}
      - name: Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        env:
          AGTERM_ALLOW_UNSIGNED: "1"
          AGTERM_WEBVIEW2_ARCH: ${{ matrix.arch }}
        run: ./scripts/release.ps1 -Version $env:VERSION -Arch ${{ matrix.arch }}
      # the Store signs it, so it is an artifact for Partner Center rather than a release asset
      - name: MSIX
        env:
          AGTERM_MSIX_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          AGTERM_MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          AGTERM_MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ./scripts/msix.ps1 -Version $env:VERSION -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: msix-${{ matrix.arch }}
          path: agterm-windows/build/release/agterm-win-*-${{ matrix.arch }}.msix
          if-no-files-found: error
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned-${{ matrix.arch }}
          path: agterm-windows/build/release/agterm-win-*-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
      # the artifact configuration signs the one installer inside the uploaded zip:
      #   <zip-file><pe-file path="agterm-win-*-setup.exe"><authenticode-sign/></pe-file></zip-file>
      - if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: agterm-win
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: agterm-windows/build/signed
      - name: Release installer
        run: |
          $signed = Test-Path build/signed
          $setup = Get-Item "$(if ($signed) { 'build/signed' } else { 'build/release' })/agterm-win-$env:VERSION-${{ matrix.arch }}-setup.exe"
          New-Item -ItemType Directory build/publish | Out-Null
          Copy-Item $setup.FullName build/publish
          if ($signed) { New-Item build/publish/signed | Out-Null }
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.arch }}
          path: agterm-windows/build/publish
          if-no-files-found: error
      # the stage is zipped unsigned: SignPath's artifact configuration signs only the installer
      - uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.arch }}
          path: agterm-windows/build/release/agterm-win-*-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

  chocolatey:
    needs: [version, publish]
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: installer-[ax]*
          path: installers
      - id: pack
        name: Pack Chocolatey package
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path 'agterm-windows/packaging/chocolatey').Path
          $out = "agterm-windows/build/package-managers/$env:VERSION/chocolatey"
          New-Item -ItemType Directory -Force "$out/tools" | Out-Null
          $installers = @{}
          foreach ($arch in 'x64', 'arm64') {
            $setup = Get-ChildItem installers -Recurse -Filter "agterm-win-$env:VERSION-$arch-setup.exe"
            if (@($setup).Count -ne 1) { throw "expected one $arch installer, found $(@($setup).Count)" }
            $installers[$arch] = @{
              Url = "https://github.com/$env:REPOSITORY/releases/download/v$env:VERSION/$($setup.Name)"
              Sha256 = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant()
            }
          }
          $tokens = @{
            Version = $env:VERSION
            UrlX64 = $installers.x64.Url
            Sha256X64 = $installers.x64.Sha256
            UrlArm64 = $installers.arm64.Url
            Sha256Arm64 = $installers.arm64.Sha256
          }
          foreach ($file in Get-ChildItem $source -Recurse -File) {
            $text = [IO.File]::ReadAllText($file.FullName)
            foreach ($name in $tokens.Keys) { $text = $text.Replace("{{$name}}", $tokens[$name]) }
            if ($text -match '\{\{\w+\}\}') { throw "$($file.Name) has an unknown token $($Matches[0])" }
            $relative = $file.FullName.Substring($source.Length).TrimStart('\', '/')
            $target = Join-Path $out $relative
            New-Item -ItemType Directory -Force (Split-Path -Parent $target) | Out-Null
            [IO.File]::WriteAllText($target, $text, [Text.UTF8Encoding]::new($false))
          }
          choco pack "$out/agterm-win.nuspec" --out "agterm-windows/build/package-managers/$env:VERSION"
          if ($LASTEXITCODE) { throw 'choco pack failed' }
      - name: Attach nupkg to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release upload "v$env:VERSION" "agterm-windows/build/package-managers/$env:VERSION/agterm-win.$env:VERSION.nupkg" --clobber
          if ($LASTEXITCODE) { throw 'attaching the nupkg to the release failed' }
      - name: Push Chocolatey package
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          choco push "agterm-windows/build/package-managers/$env:VERSION/agterm-win.$env:VERSION.nupkg" `
            --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE) { throw 'Chocolatey Community Repository upload failed' }
      - uses: actions/upload-artifact@v7
        if: always() && steps.pack.outcome == 'success'
        with:
          name: chocolatey-package
          path: agterm-windows/build/package-managers/${{ needs.version.outputs.version }}/agterm-win.${{ needs.version.outputs.version }}.nupkg
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: installer-[ax]*
          path: publish
      - uses: actions/download-artifact@v7
        with:
          pattern: portable-*
          path: publish
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          BASE: ${{ needs.version.outputs.base }}
          BASE_LINE: ${{ needs.version.outputs.base-line }}
          BRANCH: ${{ github.ref_name }}
          KIND: ${{ inputs.kind }}
          LATEST: ${{ needs.version.outputs.latest }}
          SHA: ${{ needs.version.outputs.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          $agterm = Get-Content agterm-windows/AGTERM_VERSION -TotalCount 1
          $signed = @(Get-ChildItem publish -Recurse -Filter signed).Count -eq 2
          $packages = @(Get-ChildItem publish -Recurse -Filter "agterm-win-$env:VERSION-*-setup.exe") +
                      @(Get-ChildItem publish -Recurse -Filter "agterm-win-$env:VERSION-*-portable.zip")
          $assets = foreach ($package in $packages) {
            $hash = (Get-FileHash -Algorithm SHA256 $package.FullName).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText("$($package.FullName).sha256", "$hash  $($package.Name)`n")
            $package.FullName
            "$($package.FullName).sha256"
          }
          if ($assets.Count -ne 8) { throw "expected the x64 and arm64 installers and portable zips, got $($assets -join ', ')" }
          $notesPath = "$env:RUNNER_TEMP/release-notes.md"
          ./agterm-windows/scripts/release-notes.ps1 -Version $env:VERSION -BaseTag $env:BASE -BaseBranch $env:BRANCH -OutFile $notesPath
          Add-Content $notesPath @"

          ---

          Windows 10 1809 or later, x64 or arm64, installs per user without admin. The ``-portable.zip`` runs from any
          extracted folder, without the Start menu entry or PATH change; it is unsigned.
          "@
          if ($signed) {
            Add-Content $notesPath "`nFree code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org)."
          } else {
            Add-Content $notesPath "`nUnsigned: SmartScreen warns on first run."
          }
          # a version/v* release is an older line than windows-port's, so it must not take GitHub's Latest
          $latest = if ($env:LATEST -eq 'true') { '--latest' } else { '--latest=false' }
          gh release create "v$env:VERSION" --target $env:SHA @assets --title "agterm-win $env:VERSION (agterm $agterm)" `
            --notes-file $notesPath $latest
          if ($LASTEXITCODE) { throw 'gh release create failed' }
          # a minor or major supersedes the previous line; its maintenance branch starts at that line's last release
          if ($env:KIND -ne 'incremental') {
            $branch = "version/v$env:BASE_LINE"
            if (git ls-remote --heads origin $branch) { "$branch exists" } else {
              gh api "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$branch" -f "sha=$(git rev-list -n 1 $env:BASE)"
              if ($LASTEXITCODE) { throw "creating $branch failed" }
              "created $branch at $env:BASE"
            }
          }

  winget:
    needs: [version, publish]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Submit WinGet update
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) { throw 'Set the WINGET_CREATE_GITHUB_TOKEN repository secret before releasing.' }
          $wingetCreate = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest 'https://aka.ms/wingetcreate/latest' -OutFile $wingetCreate
          & $wingetCreate update andriyg76.agterm-win `
            --version $env:VERSION `
            --urls "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/agterm-win-$env:VERSION-x64-setup.exe,https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/agterm-win-$env:VERSION-arm64-setup.exe" `
            --submit --no-open
          if ($LASTEXITCODE) { throw 'WinGet manifest submission failed' }
