name: windows

on:
  push:
    branches: [windows-port, feature/agwinterm-chrome]
  pull_request:
    branches: [windows-port, feature/presentation-ui, feature/agwinterm-chrome, feature/msix-virtualized-test]
    paths: ["agterm-windows/**", "agtermCore/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

# windows-2022 keeps Visual Studio 2022 (MSVC 14.4x), the toolchain the Swift 6.4.3 clang supports and the dev
# machine builds with; windows-2025 ships MSVC 14.5x, whose STL refuses that clang. NativeShim uses no STL, so
# windows-11-arm's Visual Studio 2026 serves arm64 as it is
env:
  SWIFT_VERSION: swift-6.4.3-release
  SWIFT_BUILD: 6.4.3-RELEASE

jobs:
  # agtermCore compiles as a path dependency of agterm-windows; macOS and Linux CI run agtermCore tests.
  # the real window on the runner's interactive desktop, as tests/integration/README.md runs it locally
  app:
    name: app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2022, swift-arch: amd64 }
          - { arch: arm64, runner: windows-11-arm, swift-arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: agterm-windows
    steps:
      - uses: actions/checkout@v7
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          swift-build: ${{ env.SWIFT_BUILD }}
          build_arch: ${{ matrix.swift-arch }}
          cache: true
      - uses: actions/cache@v6
        with:
          # not .build: its debug link comes back from the cache unreadable, and stage.ps1 copies through it
          path: agterm-windows/vendor
          key: app-vendor-${{ matrix.arch }}-${{ env.SWIFT_BUILD }}-${{ hashFiles('agterm-windows/Package.swift', 'agtermCore/Package.swift', 'agtermCore/Package.resolved', 'agterm-windows/scripts/fetch-*.ps1') }}
      - run: ./scripts/fetch-server.ps1; ./scripts/fetch-ghostty-vt.ps1 -Arch ${{ matrix.arch }}; ./scripts/fetch-webview2.ps1 -Arch ${{ matrix.arch }}; ./scripts/fetch-zmx.ps1 -Arch ${{ matrix.arch }}
      - run: swift build --build-tests
        env:
          AGTERM_WEBVIEW2_ARCH: ${{ matrix.arch }}
      - run: swift build --product agtermctl
        env:
          AGTERM_WEBVIEW2_ARCH: ${{ matrix.arch }}
      - run: swift test --skip-build
        env:
          AGTERM_WEBVIEW2_ARCH: ${{ matrix.arch }}
      - name: Release build for packages
        run: |
          swift build -c release
          swift build -c release --product agtermctl
        env:
          AGTERM_WEBVIEW2_ARCH: ${{ matrix.arch }}
      - name: Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Package unsigned installer and MSIX
        run: |
          $agterm = Get-Content AGTERM_VERSION -TotalCount 1
          ./scripts/package-ci.ps1 -Version "$agterm.0" -Arch ${{ matrix.arch }} -Output "$env:RUNNER_TEMP\ci-packages"
      - run: ./scripts/stage.ps1 -Output "$env:RUNNER_TEMP\agterm-win"
      - name: Silence the privacy settings screen
        # windows-11-arm raises "Choose privacy settings for your device" over the desktop, where screen snapshots
        # catch it. The runner is SYSTEM, so the policy goes to every loaded profile, not only its own HKCU
        run: |
          $hives = @("HKLM:") + (Get-ChildItem Registry::HKEY_USERS | ? { $_.PSChildName -notmatch "_Classes$" } |
                                 % { "Registry::HKEY_USERS\$($_.PSChildName)" })
          foreach ($hive in $hives) {
            $key = "$hive\SOFTWARE\Policies\Microsoft\Windows\OOBE"
            New-Item -Force $key | Out-Null
            Set-ItemProperty $key DisablePrivacyExperience 1 -Type DWord
            if ($hive -ne "HKLM:") {
              $key = "$hive\Software\Microsoft\Windows\CurrentVersion\UserProfileEngagement"
              New-Item -Force $key | Out-Null
              Set-ItemProperty $key ScoobeSystemSettingEnabled 0 -Type DWord
            }
          }
      - name: Integration
        run: |
          # the screen can still come back mid-run; nothing under test uses its hosts, so they are closed on sight
          $sweeper = Start-Job {
            while ($true) {
              Get-Process WWAHost, CloudExperienceHostBroker -ErrorAction SilentlyContinue | % {
                "$(Get-Date -Format HH:mm:ss) closed $($_.ProcessName) $($_.Id) '$($_.MainWindowTitle)'"
                Stop-Process $_ -Force -ErrorAction SilentlyContinue
              }
              Start-Sleep -Seconds 2
            }
          }
          try {
            ./tests/integration/run.ps1 -App "$env:RUNNER_TEMP\agterm-win" -Results "$env:RUNNER_TEMP\results"
            $code = $LASTEXITCODE
          } finally {
            Stop-Job $sweeper
            Receive-Job $sweeper | Write-Host
            Remove-Job $sweeper -Force
          }
          exit $code
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-installer-${{ matrix.arch }}
          path: ${{ runner.temp }}/ci-packages/agterm-win-*-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-msix-${{ matrix.arch }}
          path: ${{ runner.temp }}/ci-packages/agterm-win-*-${{ matrix.arch }}.msix
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msix-store-layout-${{ matrix.arch }}
          path: ${{ runner.temp }}/ci-packages/msix
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-${{ matrix.arch }}
          # a window's AF_UNIX socket cannot be read, and the upload stops at the first one
          path: |
            ${{ runner.temp }}/results
            !${{ runner.temp }}/results/**/*.sock
          if-no-files-found: ignore
